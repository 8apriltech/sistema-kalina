<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #020617;
    color: #e5e7eb;
    padding: 30px;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

table {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #334155;
    text-align: center;
}

th { color: #93c5fd; }

button {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    margin: 2px;
    font-weight: bold;
}

.ok { background: #22c55e; color: #020617; }
.excluir { background: #ef4444; color: white; }

.editar {
    background: transparent;
    color: #93c5fd;
    font-size: 16px;
    cursor: pointer;
}

input[type="date"], select {
    background: #020617;
    color: #e5e7eb;
    border: 1px solid #334155;
    border-radius: 4px;
    padding: 5px;
}

.status.vermelho { color: #ef4444; font-weight: bold; }
.status.azul { color: #3b82f6; font-weight: bold; }
.status.verde { color: #22c55e; font-weight: bold; }
.status.cinza { color: #9ca3af; font-weight: bold; }

.top {
    display: flex;
    justify-content: space-between;
    max-width: 1100px;
    margin: 0 auto 20px;
}

.cards {
    max-width: 1100px;
    margin: 0 auto 25px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.card {
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
}
</style>
</head>

<body>

<h2>Dashboard de Retiradas</h2>

<div class="cards">
    <div class="card">Total<br><strong id="card-total">0</strong></div>
    <div class="card">Em Atraso<br><strong id="card-atraso">0</strong></div>
    <div class="card">Dentro do Prazo<br><strong id="card-prazo">0</strong></div>
</div>

<div class="top">
    <button onclick="location.href='/'">← Voltar</button>
    <div>
        <select id="ano"></select>
        <select id="mes"></select>
        <button onclick="location.href='/cadastrar-paciente'">Novo Paciente</button>
    </div>
</div>

<table>
<thead>
<tr>
    <th>Nome</th>
    <th>Data Prevista</th>
    <th>Data Retirada</th>
    <th>Status</th>
    <th>Ações</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
    const formatarBR = d => d ? d.split("-").reverse().join("/") : "-";

    const tbody = document.getElementById("tbody");
    const anoSel = document.getElementById("ano");
    const mesSel = document.getElementById("mes");

    [2024,2025,2026].forEach(a => anoSel.add(new Option(a,a)));
    ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"]
    .forEach((m,i)=>mesSel.add(new Option(m,i+1)));

    const hoje = new Date();
    anoSel.value = hoje.getFullYear();
    mesSel.value = hoje.getMonth()+1;

    anoSel.onchange = mesSel.onchange = carregar;

    async function carregar() {
        const r = await fetch(
            `/dashboard/?ano=${anoSel.value}&mes=${mesSel.value}`,
            { cache: "no-store" }
        );
        if (!r.ok) return;

        const data = await r.json();

        document.getElementById("card-total").textContent = data.total_pacientes;
        document.getElementById("card-atraso").textContent = data.total_atrasados;
        document.getElementById("card-prazo").textContent =
            data.total_pacientes - data.total_atrasados;

        // 🔤 ordem alfabética correta
        data.dados.sort((a, b) =>
            a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" })
        );

        renderizar(data.dados);
    }

    function renderizar(lista) {
        tbody.innerHTML = "";
        if (!lista.length) {
            tbody.innerHTML = `<tr><td colspan="5">Nenhum registro</td></tr>`;
            return;
        }

        lista.forEach(i => {
            tbody.innerHTML += `
    <tr>
    <td>${i.nome}</td>

    <td>
    <span id="v-prev-${i.retirada_id}">${formatarBR(i.data_prevista)}</span>
    <input type="date" id="i-prev-${i.retirada_id}" value="${i.data_prevista ?? ""}" style="display:none">
    <button class="editar" onclick="editarPrev(${i.retirada_id})">✏️</button>
    <button class="ok" id="s-prev-${i.retirada_id}" style="display:none" onclick="salvarPrev(${i.retirada_id})">Salvar</button>
    </td>

    <td>
    <span id="v-ret-${i.retirada_id}">${formatarBR(i.data_retirada)}</span>
    <input type="date" id="i-ret-${i.retirada_id}" value="${i.data_retirada ?? ""}" style="display:none">
    <button class="editar" onclick="editarRet(${i.retirada_id})">✏️</button>
    </td>

    <td><span class="status ${i.cor}">${i.status}</span></td>

    <td>
    <button class="ok" onclick="marcarOk(${i.retirada_id})">OK</button>
    <button class="excluir" onclick="excluir(${i.paciente_id})">Excluir</button>
    </td>
    </tr>`;
        });
    }

    function editarPrev(id){
        document.getElementById(`v-prev-${id}`).style.display="none";
        document.getElementById(`i-prev-${id}`).style.display="inline-block";
        document.getElementById(`s-prev-${id}`).style.display="inline-block";
    }

    async function salvarPrev(id){
        const v = document.getElementById(`i-prev-${id}`).value;
        
        // permite limpar a data
        const payload = v ? { data_prevista: v } : { data_prevista: null };


        await fetch(`/retiradas/${id}/data-prevista`,{
            method:"PUT",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify(payload)
        });
        
        carregar();
    }

    function editarRet(id){
        document.getElementById(`v-ret-${id}`).style.display="none";
        document.getElementById(`i-ret-${id}`).style.display="inline-block";
    }

    async function marcarOk(id){
        const v = document.getElementById(`i-ret-${id}`).value;
        if(!v) return alert("Informe a data de retirada");
        await fetch(`/retiradas/${id}/marcar`,{
            method:"PUT",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ data_retirada:v })
        });
        carregar();
    }

    async function excluir(id){
        if(confirm("Excluir paciente?")){
            await fetch(`/pacientes/${id}`,{ method:"DELETE" });
            carregar();
        }
    }

carregar();
</script>

</body>
</html>
