<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Paciente</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #020617;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #020617;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 25px;
            color: #e5e7eb;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 6px;
            color: #cbd5f5;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #38bdf8;
            color: #020617;
        }

        button:hover {
            background: #0ea5e9;
        }

        .voltar {
            margin-top: 15px;
            background: transparent;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cadastrar Paciente</h1>

    <label>Nome completo</label>
    <input type="text" id="nome">

    <label>Data da próxima retirada</label>
    <input type="date" id="dataPrevista">

    <button type="button" onclick="salvar()">Salvar</button>
    <button class="voltar" onclick="location.href='/'">Voltar</button>
</div>

<script>
async function salvar() {
    const nome = document.getElementById("nome").value;
    const dataPrevista = document.getElementById("dataPrevista").value;

    if (!nome || !dataPrevista) {
        alert("Preencha os campos obrigatórios");
        return;
    }

    // 1️⃣ cria paciente
    const respPaciente = await fetch("/pacientes/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome })
    });

    if (!respPaciente.ok) {
        alert("Erro ao criar paciente");
        return;
    }

    const paciente = await respPaciente.json();
    const pacienteId = paciente.id;

    // 2️⃣ define data prevista (SEM ano/mes!)
    const respRetirada = await fetch("/retiradas/definir-data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            paciente_id: pacienteId,
            data_prevista: dataPrevista
        })
    });

    if (!respRetirada.ok) {
        alert("Erro ao definir data de retirada");
        return;
    }

    alert("Paciente cadastrado com sucesso!");
    location.href = "/dashboard-view";
}

</script>


</body>
</html>
