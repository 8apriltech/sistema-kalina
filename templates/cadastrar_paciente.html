<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Paciente - Sistema Kalina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.10) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(99, 102, 241, 0.06) 0px, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 36px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            width: 100%;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0ea5e9, #10b981);
        }

        .card:hover {
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.75), 0 0 30px rgba(14, 165, 233, 0.12);
            border-color: rgba(56, 189, 248, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon-circle {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: rgba(14, 165, 233, 0.12);
            border: 1px solid rgba(14, 165, 233, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: rgba(2, 6, 23, 0.6);
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            background: rgba(2, 6, 23, 0.9);
        }

        input::placeholder {
            color: #64748b;
        }

        /* Calendar picker styling */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }

        .btn-salvar {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
        }

        .btn-salvar:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.45);
        }

        .btn-salvar:active {
            transform: translateY(0);
        }

        .btn-voltar {
            width: 100%;
            margin-top: 14px;
            padding: 11px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-voltar:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }

        footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        footer a:hover {
            color: #7dd3fc;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="card">
        <div class="header">
            <div class="icon-circle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
            </div>
            <h1>Cadastrar Paciente</h1>
            <p class="subtitle">Insira as informações para acompanhamento</p>
        </div>

        <form id="formCadastro" onsubmit="event.preventDefault(); salvar();">
            <div class="form-group">
                <label for="nome">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Nome completo
                </label>
                <input type="text" id="nome" placeholder="Ex: Maria da Silva" required autofocus>
            </div>

            <div class="form-group">
                <label for="dataPrevista">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    Data da próxima retirada
                </label>
                <input type="date" id="dataPrevista" required>
            </div>

            <button type="submit" id="btnSalvar" class="btn-salvar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Salvar Paciente
            </button>

            <button type="button" class="btn-voltar" onclick="location.href='/'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Voltar para Início
            </button>
        </form>
    </div>

    <footer>
        Desenvolvido por <a href="https://8april.com.br" target="_blank" rel="noopener noreferrer">8April Tech ↗</a>
    </footer>
</div>

<script>
async function salvar() {
    const nome = document.getElementById("nome").value.trim();
    const dataPrevista = document.getElementById("dataPrevista").value;
    const btnSalvar = document.getElementById("btnSalvar");

    if (!nome || !dataPrevista) {
        alert("Preencha todos os campos obrigatórios.");
        return;
    }

    btnSalvar.disabled = true;
    btnSalvar.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Salvando...`;

    try {
        // 1️⃣ cria paciente
        const respPaciente = await fetch("/pacientes/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nome })
        });

        if (!respPaciente.ok) {
            throw new Error("Erro ao criar paciente");
        }

        const paciente = await respPaciente.json();
        const pacienteId = paciente.id;

        // 2️⃣ define data prevista
        const respRetirada = await fetch("/retiradas/definir-data", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                paciente_id: pacienteId,
                data_prevista: dataPrevista
            })
        });

        if (!respRetirada.ok) {
            throw new Error("Erro ao definir data de retirada");
        }

        location.href = "/dashboard-view";
    } catch (err) {
        alert(err.message || "Erro ao cadastrar paciente. Tente novamente.");
        btnSalvar.disabled = false;
        btnSalvar.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Salvar Paciente`;
    }
}
</script>

</body>
</html>
